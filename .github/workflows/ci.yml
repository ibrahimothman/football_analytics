name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  airflow-dag-validation:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Airflow image
        run: |
          docker build -t football-airflow-ci .

      - name: Prepare runtime directories
        run: |
          mkdir -p data reports

      - name: Validate Airflow DAG imports
        run: |
          docker run --rm \
            -e PYTHONPATH=/opt/airflow \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=False \
            -e AIRFLOW__LOGGING__LOGGING_LEVEL=ERROR \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/airflow-ci.db \
            -v "${{ github.workspace }}/dags:/opt/airflow/dags" \
            -v "${{ github.workspace }}/src:/opt/airflow/src" \
            -v "${{ github.workspace }}/data:/opt/airflow/data" \
            -v "${{ github.workspace }}/models:/opt/airflow/models" \
            -v "${{ github.workspace }}/reports:/opt/airflow/reports" \
            -v "${{ github.workspace }}/scripts/validate_dags.py:/opt/airflow/validate_dags.py" \
            football-airflow-ci \
            python /opt/airflow/validate_dags.py

  dbt-validation:
  runs-on: ubuntu-latest

  services:
    postgres:
      image: postgres:16

      env:
        POSTGRES_USER: football
        POSTGRES_PASSWORD: football
        POSTGRES_DB: football

      ports:
        - 5432:5432

      options: >-
        --health-cmd pg_isready
        --health-interval 10s
        --health-timeout 5s
        --health-retries 5

  env:
    DBT_HOST: localhost
    DBT_PORT: 5432
    DBT_USER: football
    DBT_PASSWORD: football
    DBT_DBNAME: football

  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dbt
      run: pip install dbt-postgres

    - name: Create CI source data
      run: |
        PGPASSWORD=football \
        psql \
          -h localhost \
          -U football \
          -d football \
          -f dbt/football_analytics/ci/setup.sql

    - name: Validate dbt connection
      working-directory: dbt/football_analytics
      run: dbt debug --target ci

    - name: Build dbt project
      working-directory: dbt/football_analytics
      run: dbt build --target ci
