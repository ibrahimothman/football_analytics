name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  airflow-dag-validation:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Airflow image
        run: |
          docker build -t football-airflow-ci .

      - name: Prepare runtime directories
        run: |
          mkdir -p data reports

      - name: Validate Airflow DAG imports
        run: |
          docker run --rm \
            -e PYTHONPATH=/opt/airflow \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=False \
            -v "${{ github.workspace }}/dags:/opt/airflow/dags" \
            -v "${{ github.workspace }}/src:/opt/airflow/src" \
            -v "${{ github.workspace }}/data:/opt/airflow/data" \
            -v "${{ github.workspace }}/models:/opt/airflow/models" \
            -v "${{ github.workspace }}/reports:/opt/airflow/reports" \
            football-airflow-ci \
            bash -c \
            'airflow dags list-import-errors --local --output=json' \
            | jq -e 'select(type=="array" and length == 0)'
